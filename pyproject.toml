[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlsurfer"
version = "0.1.1"
description = "Curated deep-learning morphometry orchestrator (FreeSurfer-shaped outputs)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DLSurfer contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "pymdown-extensions>=10.0"]

[project.urls]
Homepage = "https://github.com/phindagijimana/dlsurfer"
Documentation = "https://dlsurfer.readthedocs.io/"
Repository = "https://github.com/phindagijimana/dlsurfer"

[project.scripts]
dlsurfer = "dlsurfer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dlsurfer*"]

[tool.setuptools.package-data]
dlsurfer = ["*.yaml"]